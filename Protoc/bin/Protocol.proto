syntax = "proto3";
package Protocol;

import "Struct.proto";

option csharp_namespace = "Google.Protobuf.Protocol";

enum PacketID {
  PACKET_C_LOGIN = 0;
  PACKET_S_LOGIN = 1;
  PACKET_C_ENTER_GAME = 2;
  PACKET_S_ENTER_GAME = 3;
  PACKET_S_JOIN_GAME = 4;
  PACKET_C_CHAT = 5;
  PACKET_S_CHAT = 6;
}


message C_LOGIN
{

}

message S_LOGIN
{
	bool success = 1;
	uint64 playerID = 2;
}

message C_ENTER_GAME
{
	Player player = 1;
}

message S_ENTER_GAME
{
	bool success = 1;
	repeated Player players = 2;
}

message S_JOIN_GAME
{
	Player player = 1;
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerID = 1;
	string msg = 2;
}

